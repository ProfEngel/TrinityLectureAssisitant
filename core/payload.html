
            <!-- KEEP_OPEN -->
            <h2 style="margin-top: 0; font-weight: 300; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; font-size: 18px;">Langton's Ant</h2>
            <div style="font-size: 13px; opacity: 0.7; margin-bottom: 10px;">Eine zelluläre Ameise, die komplexe Muster webt.</div>
            <div style="width: 100%; display: flex; justify-content: center;">
                <canvas id="simCanvas" width="310" height="310" style="background: #000; border-radius: 10px;"></canvas>
            </div>
            <script>
                
                const canvas = document.getElementById('simCanvas');
                const ctx = canvas.getContext('2d');
                const res = 5;
                const cols = canvas.width / res;
                const rows = canvas.height / res;
                let grid = Array(cols).fill().map(() => Array(rows).fill(0));
                let x = Math.floor(cols/2);
                let y = Math.floor(rows/2);
                let dir = 0; // 0=up, 1=right, 2=down, 3=left
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,canvas.width,canvas.height);

                function draw() {
                    for(let n=0; n<50; n++) { // 50 Schritte pro Frame
                        let state = grid[x][y];
                        if (state === 0) {
                            dir = (dir + 1) % 4; // Rechts drehen
                            grid[x][y] = 1;
                            ctx.fillStyle = '#00bfff';
                        } else {
                            dir = (dir + 3) % 4; // Links drehen
                            grid[x][y] = 0;
                            ctx.fillStyle = '#000';
                        }
                        ctx.fillRect(x*res, y*res, res, res);
                        
                        if (dir === 0) y--;
                        else if (dir === 1) x++;
                        else if (dir === 2) y++;
                        else if (dir === 3) x--;
                        
                        if (x < 0) x = cols-1;
                        if (x >= cols) x = 0;
                        if (y < 0) y = rows-1;
                        if (y >= rows) y = 0;
                        
                        ctx.fillStyle = '#ff4444';
                        ctx.fillRect(x*res, y*res, res, res);
                    }
                    requestAnimationFrame(draw);
                }
                draw();
                
            </script>
