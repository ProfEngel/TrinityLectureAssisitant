
                <!-- KEEP_OPEN -->
                <div style="text-align: center; margin-top: 50px;">
                    <div style="font-size: 80px; font-weight: bold; text-shadow: 0 0 20px #00bfff; letter-spacing: 5px;" id="timer">20:00</div>
                    <div style="font-size: 14px; opacity: 0.5; margin-top: 10px;">Laufender Timer</div>
                </div>
                <script>
                    let time = 1200;
                    let timerEl = document.getElementById('timer');
                    let interval = setInterval(() => {
                        time--;
                        if(time <= 0) {
                            clearInterval(interval);
                            timerEl.innerText = "00:00";
                            timerEl.style.color = "#ff4444";
                            timerEl.style.textShadow = "0 0 20px #ff4444";
                            return;
                        }
                        let m = Math.floor(time / 60);
                        let s = time % 60;
                        timerEl.innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
                    }, 1000);
                </script>
