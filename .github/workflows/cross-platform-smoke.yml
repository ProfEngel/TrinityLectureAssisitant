name: Cross-platform smoke tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: components/TrinityCanvas/package-lock.json

      - name: Install test tools
        run: python -m pip install pytest pytest-timeout requests numpy PySide6

      - name: Compile Python sources
        run: >-
          python -m compileall -q core agents RAG trinity_launcher.py
          trinity_native_launcher.py trinity_app.py trinity_classic.py
          trinity_console.py trinity_chat.py trinity_cli.py

      - name: Run unit tests
        timeout-minutes: 5
        run: python -u -m pytest -vv -s --timeout=45 --timeout-method=thread --junitxml=test-results.xml -o faulthandler_timeout=30

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: warn

      - name: Build and smoke-test Trinity Canvas
        working-directory: components/TrinityCanvas
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run test:production

      - name: Validate macOS installer syntax
        if: runner.os == 'macOS'
        run: bash -n install_mac.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install_windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Validate Windows Python and SSL detection
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install_windows.ps1 -ValidateEnvironmentOnly -SkipPythonInstall
